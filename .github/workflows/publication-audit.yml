name: Publication audit

on:
  push:
  pull_request:

jobs:
  publication-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/publication/audit_public_repo.py --root .
