[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "servicediscoverybench"
version = "0.2.0"
description = "Code-only public implementation for ServiceDiscoveryBench"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
llm = ["httpx>=0.27,<1"]
retriever = ["numpy>=1.26", "torch>=2.2", "transformers>=4.51,<5"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = [".", "src"]

[tool.coverage.run]
source = ["src", "scripts", "experiments/llm_v0_2_qwen_sse_selection_v1_5/code"]
